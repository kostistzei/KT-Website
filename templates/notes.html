<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konstantinos Tzeiranidis – Notes</title>
	<style>
		body {
        font-family: "Times New Roman", Times, serif;
        background-color: #0A369D;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .container {
        background-color: rgba(255, 255, 255, 0.05);
        padding: 40px 20px;
        border-radius: 10px;
        max-width: 700px;
        width: 100%;
        text-align: center;
    }

    h1 {
        margin-bottom: 20px;
    }

    ul {
        list-style: none;
        padding: 0;
    }

    li {
        margin: 15px 0;
    }

    a {
        display: inline-block;
        padding: 12px 20px;
        border: 1px solid #fff;
        border-radius: 8px;
        color: #ffffff;
        text-decoration: none;
        font-size: 1.05rem;
        transition: background-color 0.2s ease;
    }

    a:hover {
        background-color: rgba(255, 255, 255, 0.15);
    }

    .back-link {
        margin-top: 30px;
        display: block;
        color: #fff;
        font-size: 0.95rem;
        text-decoration: underline;
        border: none;
        padding: 0;
    }
</style>

</head>
<body>
<div class="container">
    <h1>University Notes</h1>
    <ul>
        {% for note in notes %}
            <li>
                <a href="static/{{ note }}" target="_blank" rel="noopener">
                    {{ note }}
                </a>
            </li>
        {% endfor %}
    </ul>
    <a class="back-link" href="/">← Back to Home</a>
</div>
</body>
</html>
